services:
  - type: web
    name: speed-test-website
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/ping
    envVars:
      - key: RATELIMIT_STORAGE_URI
        value: memory://
